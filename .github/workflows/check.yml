name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          files=$(git ls-files '*.go')
          test -z "$(gofmt -l $files)"
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/scs ./cmd/cah
      - name: Disposable mounted regressions (when FUSE is available)
        run: |
          if test -c /dev/fuse && command -v fusermount3 >/dev/null; then
            SCS_TEST_FUSE=1 go test -race -count=1 -run TestMounted ./cmd/cah
          else
            echo '::warning::Mounted tests not run: /dev/fuse and fusermount3 are required.'
            echo 'Mounted validation unavailable on this runner; ordinary checks do not substitute for it.' >> "$GITHUB_STEP_SUMMARY"
          fi
